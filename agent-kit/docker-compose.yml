# Agent kit: Postgres only. Django runs on the host (see start.sh).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ilias_portal
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./docker-data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
